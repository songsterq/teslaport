<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeslaPort — Phone</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cpath d='M53.61 24.13A23 23 0 0 0 10.39 24.13' stroke='%233ddad7' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M10.39 39.87A23 23 0 0 0 53.61 39.87' stroke='%233ddad7' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M22 20 40 32 22 44' stroke='%23f5f8fa' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/client/app.css" />
  </head>
  <body class="tail">
    <header class="site-header">
      <div class="wrap">
        <span class="brand">
          <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M53.61 24.13 A23 23 0 0 0 10.39 24.13" stroke="#3ddad7" stroke-width="5" stroke-linecap="round" />
            <path d="M10.39 39.87 A23 23 0 0 0 53.61 39.87" stroke="#3ddad7" stroke-width="5" stroke-linecap="round" />
            <path d="M22 20 L40 32 L22 44" stroke="#f5f8fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <b>TeslaPort</b>
        </span>
        <a class="ghost" href="/?choose">Start over</a>
      </div>
    </header>

    <main class="wrap page">
      <div class="phone">
        <h1>Send to car</h1>

        <section class="panel" id="paired" hidden>
          <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
          <p class="field"><input type="url" id="url" placeholder="Paste a link" autocomplete="off" autocapitalize="off" spellcheck="false" /></p>
          <div class="cta-send"><button class="primary" id="send" disabled>Send</button></div>
          <p class="msg" id="msg"></p>
        </section>

        <section class="panel" id="unpaired">
          <svg class="mark-lg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M53.61 24.13 A23 23 0 0 0 10.39 24.13" stroke="#3ddad7" stroke-width="5" stroke-linecap="round" />
            <path d="M10.39 39.87 A23 23 0 0 0 53.61 39.87" stroke="#3ddad7" stroke-width="5" stroke-linecap="round" />
            <path d="M22 20 L40 32 L22 44" stroke="#f5f8fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p>Not paired yet.</p>
          <p class="hint">Open TeslaPort on your car screen and scan the QR code, or type the code below.</p>
          <p class="field"><input type="text" id="manual" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" /></p>
          <div class="cta-send"><button class="primary" id="pair">Pair</button></div>
          <p class="msg" id="pairmsg"></p>
        </section>
      </div>
    </main>

    <!--
      Deliberately no link back to "/" here: home-role.spec.ts clicks
      a[href="/?choose"] in strict mode, and the header already carries the
      only one. Both icons are inline SVG because img-src allows 'self' and
      data: only, so a hosted badge would simply not render.
    -->
    <footer class="site-footer">
      <div class="wrap">
        <div class="foot-links">
          <a class="foot-link" href="https://buymeacoffee.com/songsterq" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <path d="M16 9h1.4a2.6 2.6 0 0 1 0 5.2H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M7.5 3v2M11 3v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Buy me a coffee
          </a>
          <a class="foot-link" href="https://github.com/songsterq/teslaport" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
            </svg>
            Source on GitHub
          </a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/client/sender.ts"></script>
  </body>
</html>
